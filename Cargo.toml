[package]
name = "kl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Klethron Terminal Multiplexer"
publish = false

[dependencies]

[lints.clippy]
# Whole groups. Priority -1 lets the individual entries below override them.
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Hand-picked from `restriction`, which is not meant to be enabled as a group.

# A panic in a multiplexer takes every session down with it.
expect_used = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

# Unsafe hygiene, for the pty and ioctl code to come.
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"

# Silently dropped errors and resources.
let_underscore_must_use = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
unused_result_ok = "deny"

# Suppressions must be `#[expect(..., reason = "...")]`, so they cannot go stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Leftovers and general hygiene.
as_underscore = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
exit = "deny"
if_then_some_else_none = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
str_to_string = "deny"
string_add = "deny"
tests_outside_test_module = "deny"
try_err = "deny"
verbose_file_reads = "deny"
