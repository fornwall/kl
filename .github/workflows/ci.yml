name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Native runners rather than cross-compiling, since code behind `cfg` is only
    # linted on its own platform and the tests have to run there anyway.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      # Any patch release of the minor version that ghostty asks for will do, and
      # build.rs says so if the pin moves on to another one. The cache below
      # covers what zig builds, so its own would be a second copy.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
          use-cache: false

      # Fetching and building libghostty-vt takes a few minutes, and only depends
      # on the pin and the patch, which live in these files.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ghostty
          key: ghostty-${{ matrix.os }}-${{ hashFiles('build.rs', 'patches/**') }}

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked

      # The fuzz targets include kl's sources by path, and nothing above builds
      # them. This comes last, since it links the library built above.
      - run: cargo check --manifest-path fuzz/Cargo.toml
